<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Number Go Up</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <header id="header">
            <div id="header-stats">
                <div class="stat-pill">
                    <span class="stat-label">Cash</span>
                    <span class="stat-value" id="hud-cash">$10000</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Portfolio</span>
                    <span class="stat-value" id="hud-portfolio">$0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Net Worth</span>
                    <span class="stat-value" id="hud-net-worth">$10000</span>
                </div>
                <div class="stat-pill prestige-pill">
                    <span class="stat-label">Prestige Points</span>
                    <span class="stat-value" id="hud-prestige">0</span>
                </div>
                <div class="stat-pill">
                    <span class="stat-label">Game Time</span>
                    <span class="stat-value" id="hud-gametime">Day 1  00:00:00</span>
                </div>
            </div>
            <button id="prestige-btn" onclick="onPrestigeClick()">
                ⭐ Prestige
            </button>
        </header>
        <!-- Net Worth Chart -->
        <div id="chart-wrap">
          <canvas id="nw-chart"></canvas>
        </div>

        <main id="main">
            <section id="market-section">
                <div class="section-header">
                    <h2>Market</h2>
                    <div id="dividend-timer">
                        <span id="div-label">Next Dividend:</span>
                        <div id="div-bar-wrap"><div id="div-bar"></div></div>
                        <span id="div-countdown">10s</span>
                    </div>
                </div>
                <table id="stock-table">
                    <thead>
                        <tr>
                            <th>Ticker</th>
                            <th>Price</th>
                            <th>Change</th>
                            <th>Owned</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="stock-body"></tbody>
                    <template id="stock-row-template">
                        <tr>
                            <td>
                                <div class="ticker-name"></div>
                                <div class="ticker-company"></div>
                            </td>
                            <td class="price-cell"></td>
                            <td class="change-cell"></td>
                            <td class="owned-cell"></td>
                            <td>
                                <div class="action-cell">
                                    <button class="btn-buy">Buy</button>
                                    <button class="btn-sell">Sell</button>
                                </div>
                            </td>
                        </tr>
                    </template>
                </table>
            </section>
            <section id="portfolio-section">
                <div class="section-header">
                    <h2>Holdings</h2>
                </div>
                <div id="holdings-body"><p class="empty-msg">You don't have any shares yet.</p></div>
            </section>

            <section id="news-section">
                <div class="section-header"><h2>Market News</h2></div>
                <div id="news-feed">
                    <div class="news-item"><span class="news-ticker">MARKET</span> - Markets open!</div>
                </div>
            </section>
        </main>

        <div id="toast"></div>
    </div>

    <script src="constants.js"></script>
    <script src="state.js"></script>
    <script src="utils.js"></script>
    <script src="calc.js"></script>
    <script src="prestige.js"></script>
    <script src="chart.js"></script>
    <script src="actions.js"></script>
    <script src="news.js"></script>
    <script src="render.js"></script>
    <script src="tick.js"></script>
    
</body>
</html>
